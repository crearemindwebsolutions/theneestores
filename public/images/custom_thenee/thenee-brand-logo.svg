<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#c29b47"/>
      <stop offset="100%" stop-color="#8c6820"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16381e"/>
      <stop offset="100%" stop-color="#0c2011"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Inner Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Botanical Leaf Accents Top & Bottom -->
  <g fill="url(#goldGrad)">
    <!-- Top Leaf Cluster -->
    <path d="M250 48 C242 62, 242 76, 250 86 C258 76, 258 62, 250 48 Z"/>
    <path d="M246 68 C232 64, 222 72, 222 84 C234 82, 242 76, 246 68 Z"/>
    <path d="M254 68 C268 64, 278 72, 278 84 C266 82, 258 76, 254 68 Z"/>
    <!-- Bottom Star / Leaf Cluster -->
    <circle cx="250" cy="442" r="5"/>
    <circle cx="236" cy="442" r="3.5"/>
    <circle cx="264" cy="442" r="3.5"/>
  </g>

  <!-- Curving Top Text: THE ROOTS ENTERPRISES -->
  <path id="textArcTop" d="M 68 250 A 182 182 0 0 1 432 250" fill="none"/>
  <text font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="url(#goldGrad)" letter-spacing="4.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      THE ROOTS ENTERPRISES
    </textPath>
  </text>

  <!-- Curving Bottom Text: CRAFTED BY WOMEN • ROOTED IN NATURE -->
  <path id="textArcBottom" d="M 426 250 A 176 176 0 0 1 74 250" fill="none"/>
  <text font-family="'Poppins', sans-serif" font-size="12.5" font-weight="600" fill="#f1dfa8" letter-spacing="2.2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      CRAFTED BY WOMEN • ROOTED IN NATURE
    </textPath>
  </text>

  <!-- Center Decorative Frame -->
  <circle cx="250" cy="246" r="128" fill="#112916" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="250" cy="246" r="122" fill="none" stroke="rgba(194, 155, 71, 0.4)" stroke-width="1.2"/>

  <!-- Botanical Emblem in Center (Honeybee & Leaf Wings) -->
  <g transform="translate(250, 192)" fill="url(#goldGrad)">
    <!-- Bee Head & Antennae -->
    <circle cx="0" cy="-28" r="6.5"/>
    <path d="M -3 -34 Q -10 -46 -15 -42" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <path d="M 3 -34 Q 10 -46 15 -42" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <!-- Bee Body -->
    <ellipse cx="0" cy="-14" rx="10" ry="8"/>
    <path d="M 0 -4 C -12 6, -10 24, 0 34 C 10 24, 12 6, 0 -4 Z"/>
    <!-- Stripes -->
    <path d="M -9 4 Q 0 9 9 4" stroke="#112916" stroke-width="2.5" fill="none"/>
    <path d="M -8 13 Q 0 18 8 13" stroke="#112916" stroke-width="2.5" fill="none"/>
    <path d="M -6 22 Q 0 26 6 22" stroke="#112916" stroke-width="2.5" fill="none"/>
    <!-- Left Leaf Wing -->
    <path d="M -7 -16 C -32 -42, -56 -24, -48 4 C -38 18, -16 6, -7 -12 Z" opacity="0.92"/>
    <!-- Right Leaf Wing -->
    <path d="M 7 -16 C 32 -42, 56 -24, 48 4 C 38 18, 16 6, 7 -12 Z" opacity="0.92"/>
    <!-- Small Lower Wings -->
    <path d="M -6 -4 C -24 -6, -34 14, -22 22 C -12 24, -6 10, -6 -4 Z" opacity="0.8"/>
    <path d="M 6 -4 C 24 -6, 34 14, 22 22 C 12 24, 6 10, 6 -4 Z" opacity="0.8"/>
  </g>

  <!-- Brand Typography in Center -->
  <!-- THENEE -->
  <text x="250" y="278" font-family="'Caveat', 'Poppins', cursive, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
    THENEE
  </text>

  <!-- Tamil Script: தேனீ -->
  <text x="250" y="312" font-family="'Noto Sans Tamil', sans-serif" font-size="24" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    தேனீ
  </text>

  <!-- Origin -->
  <text x="250" y="334" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#a4d1ac" text-anchor="middle" letter-spacing="3.2">
    KADAYAM • TENKASI
  </text>
</svg>
